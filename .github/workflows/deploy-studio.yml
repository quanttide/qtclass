# 发布 studio：推送 studio/* tag（如 studio/v0.1.0-alpha.1，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Linux 客户端，打包上传到 OSS 发布分发桶（qtclass-studio，IaC 见 manifests/terraform/studio.tf）。
#
# 对齐 qtcloud-delib 的 deploy-studio.yml 模式：
#   studio/* tag → Actions（flutter build linux + ossutil cp）→ OSS 桶（qtclass-studio）→ 用户下载
#
# 触发说明：用 tag 精确匹配 studio/ 前缀，避免其他 tag 误触发。
#
# 所需 GitHub secrets / variables（org / repo 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET（secret）：RAM 用户 AccessKey（OSS 上传）

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'

concurrency:
  group: deploy-studio
  cancel-in-progress: true

env:
  OSS_BUCKET: qtclass-studio
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com

jobs:
  build-and-deploy:
    name: Build Linux Client & Upload to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # 锁版本 3.44.8（与本地开发环境一致，参考 qtcloud-delib 部署模板）：
      # 项目要求 SDK ^3.11.5，旧版 Flutter 构建会失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Build Linux Release
        working-directory: src/studio
        run: flutter build linux --release

      # 打包 bundle 为 tar.gz（含可执行文件与依赖库，便于分发下载）
      - name: Package bundle
        working-directory: src/studio/build/linux/x64/release
        run: tar -czf qtclass-linux-x64.tar.gz bundle

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload to OSS
        working-directory: src/studio/build/linux/x64/release
        run: ossutil cp qtclass-linux-x64.tar.gz oss://${{ env.OSS_BUCKET }}/studio/
