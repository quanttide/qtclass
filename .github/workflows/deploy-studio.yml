# 发布 studio：推送 studio/* tag（如 studio/v0.1.0-alpha.3，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Web 版，上传到 OSS 发布桶（qtclass-studio，IaC 见 manifests/terraform/studio.tf），
# 并刷新 CDN 缓存。
#
# 对齐 qtcloud-delib 的 deploy-studio.yml 模式：
#   studio/* tag → Actions（flutter build web，ossutil cp）→ OSS 桶（qtclass-studio，静态网站托管）
#   → CDN（class.quanttide.com，泛域名证书 *.quanttide.com）→ 用户浏览器
#
# 触发说明：用 tag 精确匹配 studio/ 前缀，避免其他 tag 误触发。
#
# 注：桌面 Linux 安装包暂不上线（已从 OSS 移除），如需恢复桌面分发，补回 Linux 构建与上传步骤。
#
# 所需 GitHub secrets / variables（org / repo 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET（secret）：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'
  workflow_dispatch: # 手动重跑（如修复部署后重新发布）

concurrency:
  group: deploy-studio
  cancel-in-progress: true

env:
  OSS_BUCKET: qtclass-studio
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: class.quanttide.com

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # 视频等 LFS 资产：必须拉取实际内容，否则构建产物是 LFS 指针

      # 锁版本 3.44.8（与本地开发环境一致，参考 qtcloud-delib 部署模板）：
      # 项目要求 SDK ^3.11.5，旧版 Flutter 构建会失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Pub get
        working-directory: src/studio
        run: flutter pub get

      - name: Build Web
        working-directory: src/studio
        run: flutter build web --release

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 缓存策略：哈希产物（main.dart.js / assets 等）长缓存；
      # index.html 无内容哈希必须 no-cache，否则发版后用户拿到旧页面
      # 注：-f 强制覆盖（ossutil 默认跳过已存在对象），保证发版更新
      - name: Upload Web to OSS（长缓存）
        working-directory: src/studio
        run: ossutil cp build/web/ oss://${{ env.OSS_BUCKET }}/ -r -f --exclude "index.html" --meta "Cache-Control:public,max-age=31536000"

      - name: Upload index.html（no-cache）
        working-directory: src/studio
        run: ossutil cp build/web/index.html oss://${{ env.OSS_BUCKET }}/index.html -f --meta "Cache-Control:no-cache"

      # 静态网站托管的错误文档（studio.tf website.error_document 指向）
      - name: Upload 404.html
        working-directory: src/studio
        run: |
          printf '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>404</title></head><body><h1>404 Not Found</h1><p><a href="/">返回首页</a></p></body></html>' > 404.html
          ossutil cp 404.html oss://${{ env.OSS_BUCKET }}/404.html -f --meta "Cache-Control:no-cache"

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
