# 发布 studio：推送 studio/* tag（如 studio/v0.1.0-alpha.1，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Linux 客户端并上传产物，供发布流程分发。
#
# 对齐 qtcloud-delib 的 deploy-studio.yml 模式：
#   studio/* tag → Actions（flutter build linux + 上传 artifact）→ 发布流程下载分发
#
# 触发说明：用 tag 精确匹配 studio/ 前缀，避免其他 tag 误触发。
#
# 差异说明：qtclass 为桌面客户端（无 Web/OSS 部署目标），故构建 Linux release bundle
# 上传为 artifact（GitHub Release 资产由 qtcloud-devops release publish 流程挂载）。

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'

concurrency:
  group: deploy-studio
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # 锁版本 3.44.8（与本地开发环境一致，参考 qtcloud-delib 部署模板）：
      # 项目要求 SDK ^3.11.5，旧版 Flutter 构建会失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Pub get
        working-directory: src/studio
        run: flutter pub get

      - name: Build Linux Release
        working-directory: src/studio
        run: flutter build linux --release

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtclass-linux-x64
          path: src/studio/build/linux/x64/release/bundle
          if-no-files-found: error
