# qtclass provider 质量门禁：vet + 全量测试（部署管道另行配置）
name: Test Provider

on:
  push:
    branches: [main]
    paths:
      - 'src/provider/**'
      - '.github/workflows/test-provider.yml'
  pull_request:
    paths:
      - 'src/provider/**'
      - '.github/workflows/test-provider.yml'

jobs:
  test:
    name: Go Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/provider/go.mod

      - name: Vet
        working-directory: src/provider
        run: go vet ./...

      - name: Test
        working-directory: src/provider
        run: go test ./... -count=1 -v
