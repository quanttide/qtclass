<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量潮课堂 · 课程首页</title>
<style>
:root {
  --brand: #1677ff;--brand-soft: #e8f4ff;--bg: #f8fafe;--surface: #f5f9fc;
  --text: #1a2332;--text-2: #556678;--text-3: #8899aa;--line: #e8ecf2;
  --radius-lg: 18px;--font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing:border-box;margin:0;padding:0; }
body { font-family:var(--font);font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased; }

.appbar { position:sticky;top:0;z-index:100;height:56px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px; }
.appbar .logo { display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:18px;color:var(--text); }
.appbar .logo .icon { width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1677ff,#5b9fff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700; }
.appbar .switch-group { display:flex;margin-left:40px; }
.appbar .switch-group button { padding:7px 20px;border:1px solid #d9d9d9;background:#fff;color:#666;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500; }
.appbar .switch-group button:first-child { border-radius:6px 0 0 6px; }
.appbar .switch-group button:last-child { border-radius:0 6px 6px 0;margin-left:-1px; }
.appbar .switch-group button.active { background:var(--brand);color:#fff;border-color:var(--brand);z-index:1; }
.appbar .meta { margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px;color:#999; }
.appbar .avatar { width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600; }

.main { overflow-y:auto;padding:0 32px 60px; }
.main-inner { max-width:860px;margin:0 auto; }
.back-link { display:inline-flex;align-items:center;gap:5px;color:var(--brand);font-size:13px;cursor:pointer;margin:16px 0 12px;padding:7px 14px;border-radius:6px;transition:all .15s;font-weight:500; }
.back-link:hover { background:var(--brand-soft); }

.course-hero { background:linear-gradient(135deg,#E3F2FD 0%,#BBDEFB 50%,#E8F5FF 100%);border-radius:var(--radius-lg);padding:40px 48px;color:var(--text);position:relative;overflow:hidden; }
.course-hero .badge-course { display:inline-block;padding:3px 12px;border-radius:9999px;background:rgba(22,119,255,.12);color:var(--brand);font-size:12px;font-weight:600;margin-bottom:12px; }
.course-hero h2 { font-size:28px;margin-bottom:8px; }
.course-hero .hero-desc { font-size:14px;color:var(--text-2);line-height:1.7;max-width:680px; }
.course-hero .hero-meta { display:flex;gap:20px;margin-top:14px;font-size:12px;color:var(--text-3); }
.course-hero .progress-bar { margin-top:14px;height:5px;background:rgba(22,119,255,.12);border-radius:3px;max-width:400px; }
.course-hero .progress-bar .fill { height:100%;border-radius:3px;background:var(--brand); }

.btn { display:inline-flex;align-items:center;gap:5px;padding:10px 28px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s; }
.btn-filled { background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;box-shadow:0 2px 8px rgba(22,119,255,.18); }
.btn-filled:hover { box-shadow:0 4px 14px rgba(22,119,255,.26);transform:translateY(-1px); }
.btn-outlined { background:transparent;color:var(--brand);border:1.5px solid var(--line); }
.btn-outlined:hover { background:var(--brand-soft); }
.btn-lg { padding:14px 32px;font-size:16px; }
</style>
</head>
<body>

<header class="appbar">
  <div class="logo"><span class="icon">~</span>量潮课堂 · LMS</div>
  <div class="switch-group">
    <button class="active">🏠 学习前台</button>
    <button>⚙ LMS 管理后台</button>
  </div>
  <div class="meta">v0.12 · MD <span class="avatar">Z</span></div>
</header>

<div class="main">
<div class="main-inner">

  <div class="back-link">← 返回课程列表</div>

  <!-- 生产实习 · 课程首页 -->
  <div class="course-hero">
    <div class="badge-course">🏭 生产实习 · 微型创业</div>
    <h2>量潮课堂 · 实训基地</h2>
    <p class="hero-desc">
      量潮是"总部"，你是"分公司"——我们不给你出题，你<strong>自己给自己出题</strong>。
      用前 4 个模块了解公司，找到盲区，做一个微型创业 demo <strong>sale 给总部</strong>。
      同一套评分，不同分数线：课程 60 分及格，招聘 90 分录用。
    </p>
    <div class="hero-meta">
      <span>📚 5 个模块</span><span>⏱ 预计 2 周</span><span>👤 38 人在学</span><span>🎯 同一套卷子，不同分数线</span>
    </div>
    <div class="progress-bar"><div class="fill" style="width:20%"></div></div>
    <div style="margin-top:20px;display:flex;gap:12px;justify-content:center">
      <button class="btn btn-filled btn-lg">▶ 继续学习</button>
      <button class="btn btn-outlined">👥 组队广场</button>
    </div>
  </div>

</div>
</div>

</body>
</html>
