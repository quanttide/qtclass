<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>量潮课堂｜互动式 Python 学习体验</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6f6f6f;
      --line: #dedede;
      --soft: #f6f6f3;
      --paper: #ffffff;
      --accent: #2f6b4f;
      --accent-soft: #e8f1ec;
      --warn: #a85f1f;
      --warn-soft: #fff4e8;
      --danger: #9b3535;
      --danger-soft: #fff0f0;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--soft);
    }

    button { font: inherit; }

    /* ============================================================
       HOME PAGE
       ============================================================ */
    #page-home {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--paper);
      align-items: center;
      padding: 0;
    }

    .home-nav {
      width:100%; max-width:1100px; margin:0 auto;
      padding:0 32px; min-height:56px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid var(--line);
    }
    .home-nav-brand { font-size:15px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
    .home-nav-links { display:flex; gap:24px; }
    .home-nav-link { font-size:13px; color:var(--muted); cursor:pointer; transition:color .15s; font-weight:500; }
    .home-nav-link:hover { color:var(--ink); }
    .home-nav-link.active { color:var(--ink); font-weight:600; }

    .home-content {
      flex:1; display:flex; flex-direction:column; justify-content:center;
      width:100%; max-width:680px; margin:0 auto; padding:64px 32px 80px;
    }
    .home-tag { display:inline-block; font-size:12px; font-weight:600; color:var(--accent); letter-spacing:.04em; margin-bottom:16px; }
    .home-content h1 { font-size:clamp(26px,3.5vw,40px); font-weight:750; line-height:1.2; letter-spacing:-.03em; margin:0 0 12px; }
    .home-subtitle { font-size:15px; color:var(--muted); line-height:1.65; margin:0 0 32px; max-width:520px; }
    .home-meta-row { display:flex; gap:28px; flex-wrap:wrap; margin-bottom:28px; }
    .home-meta-item { display:flex; flex-direction:column; gap:3px; }
    .home-meta-label { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.03em; text-transform:uppercase; }
    .home-meta-value { font-size:14px; color:var(--ink); font-weight:600; }
    .home-method { font-size:13px; color:var(--muted); margin-bottom:36px; letter-spacing:.01em; }
    .home-method-sep { color:var(--line); margin:0 8px; }
    .home-objectives-title { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:14px; }
    .home-objectives-list { list-style:none; padding:0; margin:0 0 36px; display:flex; flex-direction:column; gap:8px; }
    .home-objectives-list li { font-size:14px; color:var(--ink); line-height:1.5; display:flex; align-items:flex-start; gap:10px; }
    .home-check {
      flex-shrink:0; width:18px; height:18px; border-radius:50%;
      background:var(--accent-soft); color:var(--accent);
      display:grid; place-items:center; font-size:10px; font-weight:700; margin-top:1px;
    }
    .home-actions { display:flex; gap:12px; flex-wrap:wrap; }
    .home-btn { padding:12px 28px; border-radius:10px; font-size:15px; font-weight:650; cursor:pointer; transition:.2s ease; font-family:inherit; }
    .home-btn-primary { background:var(--accent); color:#fff; border:1px solid var(--accent); }
    .home-btn-primary:hover { filter:brightness(.92); transform:translateY(-1px); box-shadow:0 6px 20px rgba(47,107,79,.15); }
    .home-btn-secondary { background:var(--paper); color:var(--ink); border:1px solid var(--line); }
    .home-btn-secondary:hover { border-color:var(--ink); }

    @media (max-width:760px) {
      .home-nav { padding:0 20px; }
      .home-content { padding:48px 20px 64px; }
      .home-meta-row { gap:16px; }
      .home-actions { flex-direction:column; }
      .home-actions .home-btn { width:100%; text-align:center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="page-home">
    <nav class="home-nav">
      <div class="home-nav-brand">量潮课堂</div>
      <div class="home-nav-links">
        <span class="home-nav-link active">课程首页</span>
      </div>
    </nav>
    <div class="home-content">
      <div class="home-tag">Python 入门 · 互动课程</div>
      <h1>Python 基础：第一个 Python 程序</h1>
      <p class="home-subtitle">通过互动式课程体验，在关键节点做出选择，根据你的学习状态进入不同路径。借鉴互动影游中的剧情结构与剧情选择机制，让学习过程更加清晰可追踪。</p>
      <div class="home-meta-row">
        <div class="home-meta-item"><span class="home-meta-label">适合人群</span><span class="home-meta-value">Python 零基础学习者</span></div>
        <div class="home-meta-item"><span class="home-meta-label">预计时间</span><span class="home-meta-value">约 5 分钟</span></div>
        <div class="home-meta-item"><span class="home-meta-label">关键选择节点</span><span class="home-meta-value">2 个</span></div>
        <div class="home-meta-item"><span class="home-meta-label">课程难度</span><span class="home-meta-value">入门</span></div>
      </div>
      <p class="home-method">互动节点<span class="home-method-sep">·</span>状态反馈<span class="home-method-sep">·</span>分支路径<span class="home-method-sep">·</span>学习追踪</p>
      <div class="home-objectives-title">本节你将掌握</div>
      <ul class="home-objectives-list">
        <li><span class="home-check">✓</span>理解 Python 程序的基本运行流程</li>
        <li><span class="home-check">✓</span>完成第一个 print 程序</li>
        <li><span class="home-check">✓</span>学会处理常见的运行问题</li>
      </ul>
      <div class="home-actions">
        <a href="player.html" class="home-btn home-btn-primary">开始学习</a>
      </div>
    </div>
  </div>
</body>
</html>
