[package]
name = "qtclass-cli"
version = "0.1.0-alpha.1"
edition = "2021"
description = "量潮课堂命令行工具"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtclass"
readme = "README.md"
keywords = ["qtclass", "quanttide", "class", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "qtclass"
path = "src/main.rs"

[dependencies]
agent-skills-rs = "0.3"
clap = { version = "4", features = ["derive"] }
