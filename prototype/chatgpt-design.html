<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量潮课堂 · LMS</title>
<style>
  /* ====== Design Tokens ====== */
  :root {
    --brand: #1677ff;
    --brand-soft: #e8f4ff;
    --brand-muted: #b8d8ff;
    --bg: #f8fafe;
    --surface: #ffffff;
    --text: #1a2332;
    --text-2: #556678;
    --text-3: #8899aa;
    --line: #e8ecf2;
    --line-light: #f2f5f8;
    --success: #22c55e;
    --success-soft: #f0fdf4;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; line-height: 1.6;
    position: relative; overflow-x: hidden;
  }

  /* ====== 海浪背景层 ====== */
  .bg-atmo {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .bg-atmo .glow {
    position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 400px;
    background: radial-gradient(ellipse 50% 50% at 50% 40%, rgba(22,119,255,.07) 0%, transparent 70%);
  }
  .bg-atmo .wave {
    position: absolute; top: 0; left: 0; width: 100%; height: 220px; opacity: .10;
  }
  .bg-atmo .wave svg { width: 100%; height: 100%; }

  /* ====== 导航栏 ====== */
  .nav {
    position: sticky; top: 0; z-index: 100;
    height: 56px; background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 32px;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .nav-brand .icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #1677ff 0%, #5b9fff 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 700;
  }
  .nav-brand .name { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.2px; }
  .nav-tabs { display: flex; margin-left: 40px; }
  .nav-tabs button {
    padding: 7px 20px; border: 1px solid #d9d9d9; background: #fff;
    color: #666; font-size: 13px; cursor: pointer; font-family: inherit;
    font-weight: 500; transition: all .15s;
  }
  .nav-tabs button:first-child { border-radius: 6px 0 0 6px; }
  .nav-tabs button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .nav-tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); position: relative; z-index: 1; }
  .nav-meta { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 13px; color: #999; }
  .nav-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft);
    color: var(--brand); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* ====== 内容容器 ====== */
  .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 32px 72px; }

  /* ====== 面包屑 ====== */
  .crumb {
    display: inline-flex; align-items: center; gap: 5px; color: var(--brand);
    font-size: 13px; cursor: pointer; margin: 28px 0 18px; padding: 7px 14px;
    border-radius: 6px; transition: all .15s; font-weight: 500;
  }
  .crumb:hover { background: var(--brand-soft); }

  /* ====== 步骤条 ====== */
  .steps {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line);
    padding: 18px 32px; margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
    display: flex; align-items: center; justify-content: center;
  }
  .steps .back { font-size: 13px; color: var(--text-3); margin-right: 18px; cursor: pointer; flex-shrink: 0; }
  .steps .back:hover { color: var(--brand); }
  .steps .row { display: flex; align-items: center; gap: 0; }
  .step { display: flex; align-items: center; gap: 0; cursor: pointer; }
  .step .dot {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    background: #f1f5f9; color: #b0bec5; transition: all .2s;
  }
  .step .dot.ok { background: var(--success-soft); color: var(--success); }
  .step .dot.on { background: var(--brand); color: #fff; box-shadow: 0 0 0 6px rgba(22,119,255,.08); }
  .step .lbl { font-size: 13px; font-weight: 600; margin: 0 10px; color: #b0bec5; white-space: nowrap; }
  .step .lbl.ok { color: var(--success); }
  .step .lbl.on { color: var(--brand); }
  .step .conn { width: 24px; height: 2px; background: #e8ecf2; flex-shrink: 0; border-radius: 1px; }
  .step .conn.ok { background: #bbf7d0; }

  /* ====== 主内容卡片 ====== */
  .card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line);
    padding: 36px 40px; box-shadow: 0 1px 3px rgba(0,0,0,.03);
    position: relative; overflow: hidden;
  }
  .card .deck { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; letter-spacing: -.2px; }
  .card .desc { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }

  /* 条目列表 */
  .row {
    display: flex; align-items: center; gap: 11px;
    padding: 14px 16px; border-bottom: 1px solid var(--line-light);
    font-size: 14px; cursor: pointer; transition: background .12s; border-radius: 6px;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #f8fafc; }
  .row .bdot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex-shrink: 0; opacity: .5;
  }
  .row .tag { color: var(--text-3); margin-left: auto; font-size: 12px; white-space: nowrap; }

  /* 底部操作 */
  .acts { display: flex; align-items: center; gap: 16px; margin-top: 30px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 10px 28px; border-radius: var(--radius-sm); border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .btn-go {
    background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
    color: #fff; box-shadow: 0 2px 8px rgba(22,119,255,.18);
  }
  .btn-go:hover { box-shadow: 0 4px 14px rgba(22,119,255,.26); transform: translateY(-1px); }
  .btn-lnk {
    background: transparent; color: var(--brand); padding: 10px 20px;
    font-weight: 500; border-radius: var(--radius-sm);
  }
  .btn-lnk:hover { background: var(--brand-soft); }

  /* ====== 点阵装饰 ====== */
  .dots {
    position: absolute; right: 32px; bottom: 32px;
    width: 72px; height: 72px; pointer-events: none;
    background-image: radial-gradient(circle, rgba(22,119,255,.08) 1.6px, transparent 1.6px);
    background-size: 10px 10px;
  }
</style>
</head>
<body>

<!-- 背景氛围 -->
<div class="bg-atmo">
  <div class="glow"></div>
  <div class="wave">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,70 C220,140 440,20 660,75 C880,130 1100,30 1320,70 C1380,85 1420,65 1440,55 L1440,0 L0,0 Z" fill="rgba(22,119,255,0.5)"/>
      <path d="M0,100 C280,160 560,40 840,90 C1060,130 1240,80 1440,65 L1440,0 L0,0 Z" fill="rgba(64,150,255,0.3)"/>
    </svg>
  </div>
</div>

<!-- 导航 -->
<nav class="nav">
  <div class="nav-brand">
    <div class="icon">~</div>
    <span class="name">量潮课堂 · LMS</span>
  </div>
  <div class="nav-tabs">
    <button class="on">🏠 学习前台</button>
    <button>⚙ LMS 管理后台</button>
  </div>
  <div class="nav-meta">
    v0.12 · MD
    <div class="nav-avatar">Z</div>
  </div>
</nav>

<!-- 内容 -->
<div class="wrap">

  <div class="crumb">← 返回课程列表</div>

  <!-- 步骤条 -->
  <div class="steps">
    <a class="back">← 课程首页</a>
    <div class="row">
      <div class="step"><div class="dot ok">✓</div><span class="lbl ok">量潮是谁</span></div>
      <div class="conn ok"></div>
      <div class="step"><div class="dot ok">✓</div><span class="lbl ok">业务与市场</span></div>
      <div class="conn ok"></div>
      <div class="step"><div class="dot on">3</div><span class="lbl on">工作方法论</span></div>
      <div class="conn"></div>
      <div class="step"><div class="dot">4</div><span class="lbl">最新方向</span></div>
      <div class="conn"></div>
      <div class="step"><div class="dot">5</div><span class="lbl">微型创业</span></div>
    </div>
  </div>

  <!-- 主卡片 -->
  <div class="card">
    <div class="dots"></div>

    <div class="deck">🔧 三、工作方法论</div>
    <div class="desc">量潮是怎么做事的 —— 你可以直接复用这些方法</div>

    <div class="row"><span class="bdot"></span><span>3.1 从原型到成品：快速开发流程</span><span class="tag">视频 20 min</span></div>
    <div class="row"><span class="bdot"></span><span>3.2 知识工程入门（Baby 版教程）</span><span class="tag">阅读 15 min</span></div>
    <div class="row"><span class="bdot"></span><span>3.3 Web Coding 基础入门</span><span class="tag">阅读 12 min</span></div>
    <div class="row"><span class="bdot"></span><span>3.4 工作日志 + 复盘方法论</span><span class="tag">阅读 8 min</span></div>

    <div class="acts">
      <button class="btn btn-go">→ 下一模块</button>
      <button class="btn btn-lnk">← 返回课程首页</button>
    </div>
  </div>

</div>

</body>
</html>
